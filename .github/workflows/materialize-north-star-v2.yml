name: Materialize North Star V2 Assets

on:
  push:
    branches: ['north-star-assets']
    paths:
      - '.asset-v2/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: north-star-assets
          fetch-depth: 0

      - name: Decode and validate verified artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/art/brand public/art/worlds/mystic
          decode_asset() {
            local src="$1"
            local dst="$2"
            cat "$src"/*.txt | base64 --decode > "$dst"
          }
          decode_asset .asset-v2/loading-eclipse public/art/brand/loading-eclipse.webp
          decode_asset .asset-v2/mystic-world public/art/worlds/mystic/world.webp

          test "$(wc -c < public/art/brand/loading-eclipse.webp)" -eq 27602
          test "$(wc -c < public/art/worlds/mystic/world.webp)" -eq 45618
          file public/art/brand/loading-eclipse.webp | grep -qi 'Web/P image\|WebP'
          file public/art/worlds/mystic/world.webp | grep -qi 'Web/P image\|WebP'

      - name: Commit verified production artwork
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/art/brand/loading-eclipse.webp public/art/worlds/mystic/world.webp
          git commit -m "Materialize verified loading and Mystic world artwork" || exit 0
          git push origin HEAD:north-star-assets
