name: VitalQuest TestFlight

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    if: github.actor != 'github-actions[bot]'
    name: Build and submit VitalQuest
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.EXPO_APPLE_TEAM_TYPE }}

    steps:
      - name: Check release configuration
        id: ready
        shell: bash
        run: |
          if [ -n "$EXPO_TOKEN" ] && [ -n "$EXPO_ASC_API_KEY_P8" ] && [ -n "$EXPO_ASC_KEY_ID" ] && [ -n "$EXPO_ASC_ISSUER_ID" ] && [ -n "$EXPO_APPLE_TEAM_ID" ] && [ -n "$EXPO_APPLE_TEAM_TYPE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "TestFlight automation is not active yet. Complete TESTFLIGHT_SETUP.md first."
          fi

      - name: Checkout repository
        if: steps.ready.outputs.configured == 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: steps.ready.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Expo and EAS
        if: steps.ready.outputs.configured == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        if: steps.ready.outputs.configured == 'true'
        run: npm install

      - name: Prepare App Store Connect API key
        if: steps.ready.outputs.configured == 'true'
        shell: bash
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          printf '%s\n' "$EXPO_ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "EXPO_ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Queue TestFlight build
        if: steps.ready.outputs.configured == 'true'
        run: |
          eas build \
            --platform ios \
            --profile production \
            --auto-submit \
            --non-interactive \
            --no-wait \
            --what-to-test "VitalQuest $GITHUB_SHA"
