name: North Star QA Build

on:
  push:
    branches: ['north-star-assets']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: north-star-qa
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Verify North Star production assets
        shell: bash
        run: |
          set -euo pipefail
          test -s public/art/brand/loading-eclipse.webp
          test -s public/art/worlds/mystic/world.webp
          test -s public/art/worlds/mystic/hero.webp
          test -s public/art/worlds/athlete/world.webp
          test -s public/art/worlds/athlete/hero.webp
          test -s public/art/worlds/spartan/world.webp
          test -s public/art/worlds/spartan/hero.webp

          # Reject clipped/placeholder artwork: production North Star files must be substantial WebPs.
          # minimum production art sizes
          test "$(wc -c < public/art/brand/loading-eclipse.webp)" -ge 20000
          test "$(wc -c < public/art/worlds/mystic/world.webp)" -ge 30000
          test "$(wc -c < public/art/worlds/mystic/hero.webp)" -ge 30000
          test "$(wc -c < public/art/worlds/athlete/world.webp)" -ge 30000
          test "$(wc -c < public/art/worlds/athlete/hero.webp)" -ge 30000
          test "$(wc -c < public/art/worlds/spartan/world.webp)" -ge 30000
          test "$(wc -c < public/art/worlds/spartan/hero.webp)" -ge 30000
          grep -q "worlds/mystic/world.webp" src/artAssets.ts
          grep -q "worlds/athlete/world.webp" src/artAssets.ts
          grep -q "worlds/spartan/world.webp" src/artAssets.ts
          grep -q "worlds/mystic/hero.webp" src/artAssets.ts
          grep -q "worlds/athlete/hero.webp" src/artAssets.ts
          grep -q "worlds/spartan/hero.webp" src/artAssets.ts
          ! grep -q "/art/v1/" src/OnboardingV4.tsx
          ! grep -q "/art/v1/" src/OnboardingV5.tsx
          for f in src/TodayV3.tsx src/TrainV3.tsx src/QuestBoardV3.tsx src/ArmoryV3.tsx src/HeroV3.tsx src/TrainingInsightsV3.tsx src/WorkoutExperienceV3.tsx src/GeneratedWorkoutExperienceV3.tsx src/BuilderExperienceV3.tsx src/EquipmentExperienceV3.tsx src/VerificationExperienceV3.tsx src/BetaFeedbackV3.tsx; do
            ! grep -q "/art/v1/" "$f"
          done

      - name: Export Expo web app
        run: npx expo export --platform web
