name: Materialize North Star Assets

on:
  push:
    branches: [main]
    paths:
      - '.asset-staging/**'
      - '.github/workflows/materialize-north-star-assets.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode staged artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/art/brand public/art/worlds/mystic public/art/worlds/athlete public/art/worlds/spartan
          decode_asset() {
            local src="$1"
            local dst="$2"
            cat "$src"/*.txt | base64 --decode > "$dst"
          }
          decode_asset .asset-staging/loading-eclipse public/art/brand/loading-eclipse.webp
          decode_asset .asset-staging/mystic-world public/art/worlds/mystic/world.webp
          decode_asset .asset-staging/mystic-hero public/art/worlds/mystic/hero.webp
          decode_asset .asset-staging/athlete-world public/art/worlds/athlete/world.webp
          decode_asset .asset-staging/athlete-hero public/art/worlds/athlete/hero.webp
          decode_asset .asset-staging/spartan-world public/art/worlds/spartan/world.webp
          decode_asset .asset-staging/spartan-hero public/art/worlds/spartan/hero.webp
          rm -rf .asset-staging
      - name: Commit production artwork
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/art .asset-staging
          git commit -m "Materialize North Star production artwork" || exit 0
          git push
