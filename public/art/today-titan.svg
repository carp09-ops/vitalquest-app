  <radialGradient id="red" cx="52%" cy="36%" r="48%"><stop stop-color="#FF3049" stop-opacity=".52"/><stop offset=".24" stop-color="#9F3E44" stop-opacity=".22"/><stop offset=".65" stop-color="#350A10" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
