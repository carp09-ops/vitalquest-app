name: VitalQuest TestFlight

on:
  push:
    branches: ['main']

jobs:
  build_ios:
    name: Build VitalQuest for iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_testflight:
    name: Submit to TestFlight
    needs: [build_ios]
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
