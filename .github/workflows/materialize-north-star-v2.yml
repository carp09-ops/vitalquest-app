name: Materialize North Star V2 Assets

on:
  push:
    branches: ['north-star-assets']
    paths:
      - '.asset-v2/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: north-star-assets
          fetch-depth: 0

      - name: Decode and validate verified loading artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/art/brand
          cat .asset-v2/loading-eclipse/000.txt .asset-v2/loading-eclipse/001.txt | base64 --decode > public/art/brand/loading-eclipse.webp
          test "$(wc -c < public/art/brand/loading-eclipse.webp)" -eq 27602
          file public/art/brand/loading-eclipse.webp | grep -qi 'Web/P image\|WebP'

      - name: Commit verified production artwork
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/art/brand/loading-eclipse.webp
          git commit -m "Materialize verified North Star loading artwork" || exit 0
          git push origin HEAD:north-star-assets
